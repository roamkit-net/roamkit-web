name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci-node.yml

  docker:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build-push.yml
    with:
      image-name: roamkit-web
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-staging.yml
    secrets:
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}

  # Secrets come from Environment "production" on the called workflow job —
  # do not map them here (caller has no env access and would pass empties).
  deploy-production:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-production.yml
