# Build Docker image, Trivy scan, push to GHCR

name: Docker Build Push

on:
  workflow_call:
    inputs:
      image-name:
        required: true
        type: string
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      context:
        required: false
        type: string
        default: .
    secrets:
      GHCR_TOKEN:
        required: true

jobs:
  build:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - docker
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/roamkit-net/${{ inputs.image-name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch

      - name: Resolve public URLs, Turnstile sitekey, Google client id
        id: urls
        env:
          STAGING_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          PRODUCTION_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY_PRODUCTION }}
          STAGING_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          PRODUCTION_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID_PRODUCTION }}
          ANDROID_LPA_DEEP_LINK: ${{ vars.NEXT_PUBLIC_ANDROID_LPA_DEEP_LINK }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api_url=https://api.roamkit.net" >> "$GITHUB_OUTPUT"
            echo "app_url=https://roamkit.net" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
            echo "require_host=api.roamkit.net" >> "$GITHUB_OUTPUT"
            echo "forbid_host=api.staging.roamkit.net" >> "$GITHUB_OUTPUT"
            SITE_KEY="${PRODUCTION_SITE_KEY:-}"
            GOOGLE_CLIENT_ID="${PRODUCTION_GOOGLE_CLIENT_ID:-}"
            # Never bake Android LPA deep link into production images.
            ANDROID_LPA=""
            # Fail closed if main would bake the staging sitekey.
            if [ -n "${STAGING_SITE_KEY:-}" ] && [ -n "${SITE_KEY}" ] && [ "${SITE_KEY}" = "${STAGING_SITE_KEY}" ]; then
              echo "ERROR: main must not bake staging Turnstile sitekey" >&2
              exit 1
            fi
            if [ -n "${STAGING_SITE_KEY:-}" ] && [ -z "${SITE_KEY}" ]; then
              # Empty production key is allowed for Turnstile-off code deploys.
              echo "WARN: NEXT_PUBLIC_TURNSTILE_SITE_KEY_PRODUCTION empty on main (widget off bake)" >&2
            fi
            if [ -n "${STAGING_GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_ID}" ] && [ "${GOOGLE_CLIENT_ID}" = "${STAGING_GOOGLE_CLIENT_ID}" ]; then
              echo "ERROR: main must not bake staging Google client id" >&2
              exit 1
            fi
          else
            echo "api_url=https://api.staging.roamkit.net" >> "$GITHUB_OUTPUT"
            echo "app_url=https://staging.roamkit.net" >> "$GITHUB_OUTPUT"
            echo "environment=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "require_host=api.staging.roamkit.net" >> "$GITHUB_OUTPUT"
            echo "forbid_host=api.roamkit.net" >> "$GITHUB_OUTPUT"
            SITE_KEY="${STAGING_SITE_KEY:-}"
            GOOGLE_CLIENT_ID="${STAGING_GOOGLE_CLIENT_ID:-}"
            ANDROID_LPA="${ANDROID_LPA_DEEP_LINK:-}"
            if [ -n "${PRODUCTION_SITE_KEY:-}" ] && [ -n "${SITE_KEY}" ] && [ "${SITE_KEY}" = "${PRODUCTION_SITE_KEY}" ]; then
              echo "ERROR: develop/non-main must not bake production Turnstile sitekey" >&2
              exit 1
            fi
            if [ -n "${PRODUCTION_GOOGLE_CLIENT_ID:-}" ] && [ -n "${GOOGLE_CLIENT_ID}" ] && [ "${GOOGLE_CLIENT_ID}" = "${PRODUCTION_GOOGLE_CLIENT_ID}" ]; then
              echo "ERROR: develop/non-main must not bake production Google client id" >&2
              exit 1
            fi
          fi
          echo "turnstile_site_key=${SITE_KEY}" >> "$GITHUB_OUTPUT"
          echo "google_client_id=${GOOGLE_CLIENT_ID}" >> "$GITHUB_OUTPUT"
          echo "android_lpa_deep_link=${ANDROID_LPA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.api_url }}
            NEXT_PUBLIC_APP_URL=${{ steps.urls.outputs.app_url }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ steps.urls.outputs.turnstile_site_key }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ steps.urls.outputs.google_client_id }}
            NEXT_PUBLIC_ANDROID_LPA_DEEP_LINK=${{ steps.urls.outputs.android_lpa_deep_link }}
            ROAMKIT_GIT_SHA=${{ github.sha }}
            ROAMKIT_BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
            ROAMKIT_IMAGE_TAG=${{ github.sha }}
            ROAMKIT_ENVIRONMENT=${{ steps.urls.outputs.environment }}

      - name: Assert baked API host and Turnstile sitekey in image
        if: github.event_name == 'push'
        env:
          STAGING_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          PRODUCTION_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY_PRODUCTION }}
          BAKED_SITE_KEY: ${{ steps.urls.outputs.turnstile_site_key }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/roamkit-net/${{ inputs.image-name }}:${{ github.sha }}"
          REQUIRE_HOST="${{ steps.urls.outputs.require_host }}"
          FORBID_HOST="${{ steps.urls.outputs.forbid_host }}"
          docker pull "$IMAGE"
          # Standalone Next puts client chunks under /.next/static
          if ! docker run --rm --entrypoint sh "$IMAGE" -c \
            "grep -R -- \"$REQUIRE_HOST\" .next/static >/dev/null"; then
            echo "ERROR: expected baked host missing: ${REQUIRE_HOST}" >&2
            exit 1
          fi
          if docker run --rm --entrypoint sh "$IMAGE" -c \
            "grep -R -- \"$FORBID_HOST\" .next/static >/dev/null"; then
            echo "ERROR: forbidden host found in image: ${FORBID_HOST}" >&2
            exit 1
          fi
          echo "Bake assert OK: require=${REQUIRE_HOST} forbid=${FORBID_HOST}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -n "${STAGING_SITE_KEY:-}" ] && [ -n "${BAKED_SITE_KEY}" ] && [ "${BAKED_SITE_KEY}" = "${STAGING_SITE_KEY}" ]; then
              echo "ERROR: main image must not contain staging Turnstile sitekey" >&2
              exit 1
            fi
            if [ -n "${STAGING_SITE_KEY:-}" ] && docker run --rm --entrypoint sh "$IMAGE" -c \
              "grep -RF -- \"$STAGING_SITE_KEY\" .next/static >/dev/null"; then
              echo "ERROR: staging Turnstile sitekey found in main image" >&2
              exit 1
            fi
            if [ -n "${BAKED_SITE_KEY}" ]; then
              if ! docker run --rm --entrypoint sh "$IMAGE" -c \
                "grep -RF -- \"$BAKED_SITE_KEY\" .next/static >/dev/null"; then
                echo "ERROR: expected production Turnstile sitekey missing from image" >&2
                exit 1
              fi
            fi
          else
            if [ -n "${PRODUCTION_SITE_KEY:-}" ] && [ -n "${BAKED_SITE_KEY}" ] && [ "${BAKED_SITE_KEY}" = "${PRODUCTION_SITE_KEY}" ]; then
              echo "ERROR: non-main image must not contain production Turnstile sitekey" >&2
              exit 1
            fi
            if [ -n "${PRODUCTION_SITE_KEY:-}" ] && docker run --rm --entrypoint sh "$IMAGE" -c \
              "grep -RF -- \"$PRODUCTION_SITE_KEY\" .next/static >/dev/null"; then
              echo "ERROR: production Turnstile sitekey found in non-main image" >&2
              exit 1
            fi
          fi
          echo "Turnstile bake-key guard OK"

      - name: Trivy scan
        if: github.event_name == 'push'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/roamkit-net/${{ inputs.image-name }}:${{ github.sha }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
