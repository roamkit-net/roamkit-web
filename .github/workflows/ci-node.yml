# Reusable CI for Node.js (roamkit-web)

name: CI Node

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: "22"

jobs:
  lint-and-build:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.staging.roamkit.net
          NEXT_PUBLIC_APP_URL: https://staging.roamkit.net
        run: npm run build
