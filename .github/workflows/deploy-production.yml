# Deploy to Hetzner production on merge to main (ADR 013 / Gate C)
#
# This workflow owns WEB_IMAGE only (immutable git SHA).
# It must not read or write API_IMAGE except to fail if the existing pin is
# missing or mutable. The existing API_IMAGE pin in the production .env stays
# as-is. Build identity stays inside the image, not in the shared runtime .env.
#
# Secrets must be passed from the caller (repo or org secrets). Environment
# "production" alone is not enough for reusable workflow_call — GitHub does
# not reliably expose env-only secrets unless the caller maps them. Prefer
# repo secrets PRODUCTION_HOST / PRODUCTION_SSH_KEY (same pattern as staging).

name: Deploy Production

on:
  workflow_call:
    inputs:
      stack-dir:
        required: false
        type: string
        default: /opt/stacks/roamkit-production
    secrets:
      PRODUCTION_HOST:
        required: true
      PRODUCTION_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - x64
      - roamkit
      - default
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Validate production secrets
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          missing=0
          if [ -z "${PRODUCTION_HOST}" ]; then
            echo "::error::Missing PRODUCTION_HOST — set repo secret PRODUCTION_HOST (and optionally Environment → production)"
            missing=1
          fi
          if [ -z "${PRODUCTION_SSH_KEY}" ]; then
            echo "::error::Missing PRODUCTION_SSH_KEY — set repo secret PRODUCTION_SSH_KEY (and optionally Environment → production)"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Production deploy secrets are present."

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: root
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -euo pipefail
            STACK_DIR="${{ inputs.stack-dir }}"
            cd "$STACK_DIR"
            count_key() {
              grep -c -E "^${1}=" .env 2>/dev/null || true
            }
            assert_immutable() {
              name="$1"
              ref="$2"
              case "$name" in
                API_IMAGE) repo="ghcr.io/roamkit-net/roamkit-api" ;;
                WEB_IMAGE) repo="ghcr.io/roamkit-net/roamkit-web" ;;
                *)
                  echo "ERROR: unknown pin ${name}" >&2
                  exit 1
                  ;;
              esac
              case "$ref" in
                "${repo}@sha256:"*)
                  hex="${ref##*@sha256:}"
                  if ! printf '%s' "$hex" | grep -Eq '^[0-9a-f]{64}$'; then
                    echo "ERROR: ${name} digest is not 64 hex chars: ${ref}" >&2
                    exit 1
                  fi
                  ;;
                "${repo}:"*)
                  tag="${ref##*:}"
                  if ! printf '%s' "$tag" | grep -Eq '^[0-9a-f]{40}$'; then
                    echo "ERROR: ${name} must be an immutable 40-hex SHA or sha256 digest, got: ${ref}" >&2
                    exit 1
                  fi
                  ;;
                *)
                  echo "ERROR: ${name} must be an immutable ${repo} SHA tag or sha256 digest, got: ${ref}" >&2
                  exit 1
                  ;;
              esac
            }
            append_pin() {
              key="$1"
              value="$2"
              if [ -s .env ]; then
                last="$(tail -c1 .env || true)"
                if [ -n "${last}" ] && [ "${last}" != $'\n' ]; then
                  printf '\n' >> .env
                fi
              fi
              printf '%s=%s\n' "${key}" "${value}" >> .env
            }
            api_count="$(count_key API_IMAGE)"
            web_count="$(count_key WEB_IMAGE)"
            api_count="${api_count:-0}"
            web_count="${web_count:-0}"
            if [ "${api_count}" -ne 1 ]; then
              echo "ERROR: API_IMAGE must appear exactly once in ${STACK_DIR}/.env (found ${api_count})" >&2
              exit 1
            fi
            if [ "${web_count}" -gt 1 ]; then
              echo "ERROR: WEB_IMAGE appears ${web_count} times in ${STACK_DIR}/.env" >&2
              exit 1
            fi
            api_pin="$(grep -E '^API_IMAGE=' .env | cut -d= -f2- | tr -d '[:space:]')"
            assert_immutable API_IMAGE "${api_pin}"
            WEB_IMAGE="ghcr.io/roamkit-net/roamkit-web:${{ github.sha }}"
            assert_immutable WEB_IMAGE "${WEB_IMAGE}"
            if [ "${web_count}" -eq 1 ]; then
              sed -i "s|^WEB_IMAGE=.*|WEB_IMAGE=${WEB_IMAGE}|" .env
            else
              append_pin WEB_IMAGE "${WEB_IMAGE}"
            fi
            sed -i \
              -e '/^ROAMKIT_GIT_SHA=/d' \
              -e '/^ROAMKIT_IMAGE_TAG=/d' \
              -e '/^ROAMKIT_BUILD_DATE=/d' \
              .env
            after="$(grep -E '^API_IMAGE=' .env | cut -d= -f2- | tr -d '[:space:]')"
            if [ "${after}" != "${api_pin}" ]; then
              echo "ERROR: API_IMAGE changed during web deploy (was ${api_pin}, now ${after})" >&2
              exit 1
            fi
            ./scripts/deploy-production.sh

      - name: Smoke test (from runner)
        run: |
          wait_http() {
            local url="$1"
            local i
            for i in $(seq 1 20); do
              if curl -4sf --max-time 15 "${url}" >/dev/null; then
                return 0
              fi
              sleep 3
            done
            echo "Smoke failed: ${url}" >&2
            return 1
          }
          wait_http https://api.roamkit.net/health/live
          wait_http https://api.roamkit.net/health/ready
          wait_http https://roamkit.net/
